name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. Nothing here is a deployment,
# so an in-flight run of an older commit is only burning minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs no database. Kept as one job because the steps share an
  # install, and `npm ci` on this workspace costs more than all of them together.
  checks:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck (four workspaces)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The web app's CSS custom properties are generated from the shared tokens.
      # Before this check they were two hand-maintained copies that had already
      # drifted — the tests asserted one set of colours and the screens rendered
      # another.
      - name: Design tokens are in sync
        run: npm run tokens:check

      # Caught a real one on its first run: the README linked to a path containing
      # `(app)`, whose closing parenthesis ends a markdown link early, so it rendered
      # broken on GitHub while looking correct in the source.
      - name: Documentation links resolve
        run: npm run check:docs

      - name: Unit tests
        run: npm test

      # The build needs the public Supabase values present, because `next build`
      # evaluates server components that construct a client. They are not secrets —
      # the anon key is shipped to every browser by design — but they must exist or
      # the build fails on a missing-URL error that reads like a code fault.
      - name: Build web
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Gzipped bytes, measured from the build output that has just been produced.
      # Deterministic and attributable to a commit, unlike a Lighthouse score, which
      # measures the runner. Fails if a dependency reaches the client bundle or if the
      # middleware grows — the middleware is paid on every single request.
      - name: Performance budgets
        run: npm run check:bundle

      # Catches what tsc cannot: a package that resolves through TypeScript's path
      # mapping but not through Metro's resolver. `metro.config.js` needs both
      # `watchFolders` and `nodeModulesPaths`, and losing either breaks only here.
      - name: Bundle mobile
        run: npx expo export --platform android --output-dir /tmp/ece-bundle
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # The one that matters. Separate because it needs credentials, and because a red
  # cross here means something different from a failing unit test: it means one
  # centre can reach another centre's children.
  #
  # Skipped on pull requests from forks, where secrets are not available — GitHub
  # withholds them by design, and a job that cannot possibly pass is noise. Pushes
  # to main always run it.
  tenant-isolation:
    name: RLS isolation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fails loudly rather than skipping. A green tick that silently tested nothing
      # is worse than a red one, and this is the suite that would be missed.
      - name: Check credentials are configured
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL is not set in repository secrets."
            echo "The RLS suite is the only thing proving one centre cannot read"
            echo "another centre's data. It is not optional."
            exit 1
          fi

      # Refuses if a migration file changed after being applied, which means the
      # schema being tested is not the schema in this commit.
      - name: Migration status
        run: npm run migrate -- --status
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Ends in ROLLBACK, so it leaves nothing behind and is safe against a live
      # project. Worth moving to a dedicated CI database before this holds real
      # children's records — safe is not the same as appropriate.
      - name: Tenant isolation
        run: npm run test:rls
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Extract every table, reload it into a shadow schema, compare. Proves the data
      # survives a round trip through JSON and HTTP — timestamptz, jsonb, arrays, seven
      # enums, a daterange exclusion constraint. Drops the shadow schema and deletes the
      # extract afterwards; the extract is written to a temp directory and never to the
      # workspace, because it is every child's record in one file.
      - name: Restore drill
        run: npm run drill:restore
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Sixteen checks against the live schema: RLS enablement, grants (table AND column),
      # definer search_path, one permissive read path per table, audit coverage, storage
      # privacy, and that an issued invoice cannot be edited. Fails on critical or high;
      # medium and low are printed for a human, because a gate that fires on an advisory
      # is a gate somebody turns off.
      - name: Security review
        run: npm run review:security
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

  # End-to-end and the WCAG 2.2 AA audit. Its own job because it needs a browser, a
  # production build and the service-role key — it creates a throwaway tenant, audits
  # every screen with data in it, and drops the tenant on the way out even if it failed.
  #
  # The service-role key is here and nowhere else in this file. It bypasses RLS, so it
  # is the one secret whose exposure would be indistinguishable from having no policies
  # at all.
  audit:
    name: e2e · accessibility
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    # SERIALISED AGAINST `tenant-isolation`, BECAUSE THERE IS ONLY ONE DATABASE.
    #
    # This is the only `needs:` in the file and it is not about build order — both jobs
    # start from a clean checkout. It is about the fact that `AST06` wants three
    # environments and this project has one, which is production (see
    # unverified-claims item 48). Both jobs write to it.
    #
    # `test:rls` asserts ABSOLUTE row counts, deliberately and with a comment saying so
    # — e.g. `count(*) from public.notifications where kind = 'attendance'` = 2, read as
    # `postgres` so it sees every tenant's rows. `drill:restore` extracts every row in
    # `public` and compares row counts against a shadow reload. Both are correct
    # assertions about a quiet database and both are meaningless while something else is
    # inserting.
    #
    # This job seeds its own tenant and drives 119 browser tests through it, so it is
    # that something else. Run in parallel, `tenant-isolation` fails with a count that
    # looks exactly like a broken policy or a broken restore.
    #
    # WHAT WAS OBSERVED, AND WHAT IS INFERRED — kept apart on purpose, because the first
    # explanation written here was wrong.
    #
    # Observed 2026-09-03: `test:rls` failed on that notifications assertion twice, and
    # the first note in this comment blamed a concurrently-running local e2e run. Checking
    # the timestamps killed that: the e2e run had finished nine minutes earlier. The actual
    # rows belonged to an audit tenant from that finished run which its teardown had left
    # behind, and `sweepStaleAuditTenants` has a deliberate two-hour grace period so it
    # will not reclaim a tenant that young. So the RLS suite is broken by e2e **leftovers**
    # for up to two hours, whatever the job order — and this `needs:` does not fix that.
    #
    # Inferred, and the reason the `needs:` is still right: an e2e run happening *at the
    # same time* would break the same assertions, because it inserts attendance
    # notifications and the assertion counts them across every tenant. That follows from
    # what both suites demonstrably do, but it has not been reproduced, and it is not what
    # was seen here.
    #
    # Either way **nothing in CI had ever exposed this**, because `audit` and
    # `tenant-isolation` have never both run — they are the two jobs gated on the secrets
    # that unverified-claims item 41 is about. The RLS job is the single worst place in
    # this repo for a spurious red: a red cross there is supposed to mean one centre can
    # reach another centre's children.
    #
    # Ordered isolation-first on purpose. AGENTS.md §5 calls the RLS suite "the one that
    # matters"; if it is red there is no reason to spend ten minutes on browser tests.
    #
    # The real fix is a second database and it is owner-blocked (AST06). Delete this
    # `needs:` when the e2e job gets its own project — not before.
    needs: [tenant-isolation]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check credentials are configured
        run: |
          if [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "SUPABASE_SERVICE_ROLE_KEY is not set in repository secrets."
            echo "The audit seeds its own tenant, so it cannot run without it."
            exit 1
          fi

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # Builds first: the audit runs against `next start`, because a contrast
      # measurement taken against the dev server measures something nobody is served.
      - name: Audit
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
